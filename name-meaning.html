<div class="result-card"><h4>📚 Fun Fact 趣闻</h4><p>${info[3]}</p></div>`;
}else{
// Generate algorithmic result for unknown names
const h=name.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
const origins=["English","Greek","Latin","Hebrew","Germanic","Celtic","Arabic","Sanskrit"];
const traits=["Creative, gentle, thoughtful 有创造力、温和、体贴","Ambitious, charismatic, bold 有野心、有魅力、大胆","Wise, patient, loyal 智慧、有耐心、忠诚","Energetic, optimistic, adventurous 精力充沛、乐观、爱冒险","Elegant, intuitive, compassionate 优雅、直觉强、有同情心"];

document.getElementById('results').innerHTML=`
<div class="result-card"><h4>📌 Origin 来源</h4><p>${origins[h%origins.length]} (estimated 推测)</p></div>

<div class="result-card"><h4>🎭 Personality Traits 性格特征</h4><p>${traits[h%traits.length]}</p></div>
<div class="result-card"><h4>📊 Name Popularity 名字热度</h4><p>Uniqueness score: ${60+h%35}/100 独特度评分</p></div>`;
}}
